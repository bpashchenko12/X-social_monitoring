name: Refresh X mention data

# Twice a day at Japan's morning (07:30 JST) and evening (20:30 JST) activity peaks.
# GitHub cron is best-effort (runs can start late or be skipped) and scheduled workflows are
# disabled after 60 days without repository activity; the pipeline detects missed runs itself.
on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 JST
    - cron: "30 11 * * *"   # 20:30 JST
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = decide (weekly sweep on Monday morning JST); sweep = 7-day window"
        type: choice
        options: [auto, incremental, sweep]
        default: auto
      llm_only:
        description: "Skip scraping (no Apify cost): only translate pending posts. Use for the first LLM test."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: LLM connectivity check (manual llm_only runs; a few cents)
        if: ${{ inputs.llm_only }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m pipeline.run llm-check

      # Exit codes: 0 ok, 2 published but degraded (warning), 1 failed and rolled back.
      # The step itself never fails so that spend ledgers are committed even after a rollback;
      # the "Enforce result" step below turns code 1 into a red run.
      - name: Scrape, translate, validate
        id: auto
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          MODE: ${{ inputs.mode || 'auto' }}
          EXTRA: ${{ inputs.llm_only && '--skip-scrape' || '' }}
        run: |
          set +e
          python -m pipeline.run auto --yes --mode "$MODE" $EXTRA
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 2 ]; then echo "::warning::Run published but degraded; see the e-mail / data/last_run.json"; fi
          exit 0

      - name: Commit data
        if: ${{ steps.auto.outputs.code != '' }}
        run: |
          git config user.name "xm-monitor-bot"
          git config user.email "xm-monitor-bot@users.noreply.github.com"
          git add docs/data data/runs.jsonl data/llm_runs.jsonl data/last_run.json data/auto_runs.jsonl data/review_queue.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: auto refresh $(date -u +%FT%H:%MZ) (exit ${{ steps.auto.outputs.code }})"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not push the refreshed data"
          exit 1

      - name: Enforce result
        if: ${{ steps.auto.outputs.code != '' }}
        run: |
          code='${{ steps.auto.outputs.code }}'
          if [ "$code" = 0 ] || [ "$code" = 2 ]; then exit 0; fi
          echo "::error::pipeline failed (exit $code); published data was restored from the snapshot"
          exit 1

      - name: Alert on workflow failure
        if: ${{ failure() }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m pipeline.run alert \
            --subject "[XM Monitor] workflow FAILED" \
            --body "The scheduled refresh failed. A failed run never changes the published dashboard data. Details: $RUN_URL" || true
