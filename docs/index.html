<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XMTrading X Mention Monitor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1b3a'/%3E%3Cpath d='M9 9l14 14M23 9L9 23' stroke='%23ffd166' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#0b1b3a; --navy2:#16294f; --ink:#1b2437; --muted:#667085; --line:#e4e8f0;
  --bg:#f3f5fa; --surface:#fff; --accent:#3b6cff; --accent-soft:#e8eeff; --gold:#ffd166; --gold-soft:#fdf1cf;
  --pos:#14a05a; --neg:#e5484d; --neu:#8d97aa; --pend:#cfd6e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px -8px rgba(16,24,40,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
.hero{background:radial-gradient(1200px 400px at 85% -20%,#2a4a9a55,transparent),linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
.hero .wrap{display:flex;align-items:center;gap:18px;padding-top:22px;padding-bottom:64px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:12px;background:#ffffff14;display:grid;place-items:center;border:1px solid #ffffff22}
.hero h1{margin:0;font-size:22px;letter-spacing:.2px;font-weight:700}
.hero p{margin:2px 0 0;color:#b9c4e0;font-size:13px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff22;font-size:12.5px;color:#dbe3f7}
.chip i{width:8px;height:8px;border-radius:50%;background:#37d67a;box-shadow:0 0 0 3px #37d67a33}
.chip.demo i{background:var(--gold);box-shadow:0 0 0 3px #ffd16633}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn:hover{border-color:#c6cee0;background:#fafbff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2f5cf0}
.btn.ghost{background:#ffffff14;border-color:#ffffff30;color:#fff}
.btn.ghost:hover{background:#ffffff26}
.hero .seg{background:#ffffff14;border:1px solid #ffffff22}
.hero .seg button{color:#dbe3f7;padding:5px 12px}
.hero .seg button[aria-pressed=true]{color:#3b2d00}
.btn:disabled{opacity:.5;cursor:default}

/* control bar */
.controls{margin-top:-40px;position:relative;z-index:5}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid #eef1f7}
.bar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;padding:14px 18px}
.bar label.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--gold);color:#3b2d00;box-shadow:0 1px 2px #0002}
.dates{display:flex;align-items:center;gap:8px}
input[type=date],input[type=search],input[type=number],select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;min-height:36px}
input[type=search]{min-width:220px}
input[type=number]{width:84px}
.range-note{color:var(--muted);font-size:12.5px}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;transition:.15s}
.tab:hover{border-color:#c6cee0}
.tab[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 8px 18px -10px var(--navy)}
.tab .n{font-size:12px;background:var(--bg);color:var(--muted);border-radius:999px;padding:1px 8px}
.tab[aria-selected=true] .n{background:#ffffff22;color:#fff}

h2.title{font-size:30px;line-height:1.15;margin:20px 0 4px;font-weight:800;letter-spacing:-.3px}
h2.title small{color:var(--accent);font-weight:800}
.sub{color:var(--muted);margin:0 0 16px}

/* search terms */
.qbox{padding:0;margin:0 0 14px;overflow:hidden}
.qbox>summary{cursor:pointer;padding:13px 18px;font-weight:700;display:flex;gap:10px;align-items:center;list-style:none;user-select:none}
.qbox>summary::-webkit-details-marker{display:none}
.qbox>summary::before{content:"\25B8";color:var(--accent);transition:.15s}
.qbox[open]>summary::before{transform:rotate(90deg)}
.qbox>summary small{font-weight:500;color:var(--muted)}
.qbody{padding:2px 18px 16px;display:grid;gap:12px}
.qrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;font-size:13px}
.qrow>b{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{background:var(--accent-soft);color:#1d3fa8;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600}
.chip2.brand{background:var(--navy);color:#fff}
.chip2.flt{background:#eef1f6;color:#344056;font-weight:500}
.qcode{display:flex;gap:10px;align-items:flex-start;background:#0f1a33;color:#d8e2ff;border-radius:10px;padding:11px 14px}
.qcode code{flex:1;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.qcode button{all:unset;cursor:pointer;color:#9db8ff;font-size:12px;font-weight:700;white-space:nowrap}
.qcode button:hover{color:#fff}
.qnote{color:var(--muted);font-size:12.5px;line-height:1.6}
@media (max-width:700px){.qrow{grid-template-columns:1fr;gap:4px}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
.kpi{padding:14px 16px;position:relative;overflow:hidden}
.kpi .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;white-space:nowrap}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi.hl{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0}
.kpi.hl .k{color:#aebbd9}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:56px;height:56px;border-radius:50%;background:var(--accent-soft);opacity:.7}
.kpi.hl::after{background:#ffffff10}

/* charts */
.charts{display:grid;grid-template-columns:1fr 1.25fr 1.1fr;gap:14px;margin-top:14px}
.card{padding:16px 18px}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:grid;gap:7px;font-size:13px;min-width:150px}
.legend div{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;padding-left:10px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
svg text{font-family:inherit}
.bars{width:100%;height:170px}
.acct{display:grid;gap:8px}
.acct .row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.acct .row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.acct .fill{height:100%;background:linear-gradient(90deg,var(--accent),#7c9bff);border-radius:6px}

/* table */
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:14px 18px;border-bottom:1px solid var(--line)}
.tools .f{display:flex;flex-direction:column}
.tools .grow{flex:1}
.check{display:flex;align-items:center;gap:8px;padding-bottom:7px;cursor:pointer;user-select:none}
.scroll{overflow:auto;max-height:78vh;border-radius:0 0 var(--radius) var(--radius)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1280px}
thead th{position:sticky;top:0;background:#eaf0fd;z-index:2;text-align:left;font-size:12.5px;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;color:#26324d}
thead th.num{text-align:right}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
thead th button:hover{color:var(--accent)}
thead th button:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.arrow{font-size:10px;color:var(--accent)}
tbody td{padding:12px 10px;vertical-align:top;border-bottom:1px solid #eef1f6}
tbody tr:nth-child(even){background:#fafbfe}
tbody tr:hover{background:#f1f5ff}
td.num{text-align:right;white-space:nowrap}
td.rank{color:var(--muted);width:36px}
td.date{white-space:nowrap;color:#344056}
td.date small{display:block;color:var(--muted)}
.txt{max-width:340px;min-width:240px;white-space:pre-wrap;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.txt.open{display:block}
.more{all:unset;color:var(--accent);cursor:pointer;font-size:12px;margin-top:3px;display:inline-block}
.pending{color:var(--muted);font-style:italic}
.acc b{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc a{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--gold-soft);color:#7a5a00;margin-top:3px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.Positive{background:#dff5e9;color:#0c7a43}
.pill.Negative{background:#fde4e5;color:#b3262b}
.pill.Neutral{background:#e9ecf2;color:#4d586c}
.pill.pend{background:repeating-linear-gradient(45deg,#eef1f6,#eef1f6 5px,#e2e7ef 5px,#e2e7ef 10px);color:#667085}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg);display:block;border:1px solid var(--line)}
.linkbtn{display:inline-flex;gap:4px;align-items:center;font-weight:600;white-space:nowrap}
.dash{color:#aab2c3}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:8px 0}
.skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,#eceff5,#f7f8fc,#eceff5);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{background:#fff3f3;border:1px solid #f5c2c4;color:#8a1f24;padding:16px 18px;border-radius:12px;margin-top:20px}
.foot{color:var(--muted);font-size:12.5px;padding:22px 0 40px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mk{display:inline-block;margin:0 4px 4px 0;padding:2px 8px;border-radius:999px;background:#eef1f6;color:#4d586c;font-size:11.5px;font-weight:600;line-height:1.5}
.mk.on{background:var(--accent-soft);color:#1d3fa8}
td.mt{min-width:150px;max-width:200px}
.mob-sort{display:none}

/* post modal */
body.modal-open{overflow:hidden}
.modal-bg{position:fixed;inset:0;background:rgba(11,27,58,.55);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:760px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 60px -12px rgba(11,27,58,.45)}
.mhead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead b{font-size:16px}
.mmeta{margin-top:4px;color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.mclose{border:0;background:var(--bg);border-radius:10px;width:40px;height:40px;font-size:24px;line-height:1;cursor:pointer;flex:0 0 auto}
.mclose:hover{background:#e4e8f0}
.mbody{overflow:auto;padding:16px 20px;display:grid;gap:16px;-webkit-overflow-scrolling:touch}
.mbody h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mtext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:15px}
.mmetrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mm{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.mm span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm b{font-size:15px}
.mimg{max-width:100%;max-height:320px;border-radius:12px;border:1px solid var(--line);display:block}
.mfoot{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.mfoot .btn{text-decoration:none;justify-content:center}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.charts{grid-template-columns:1fr 1fr}.charts .card:last-child{grid-column:1/-1}}

/* ---------- mobile ---------- */
@media (max-width:700px){
  body{font-size:14px}
  .wrap{padding:0 12px}
  input[type=date],input[type=search],input[type=number],select{font-size:16px;min-height:42px;width:100%;min-width:0}
  .btn,.seg button{min-height:40px}
  /* header */
  .hero .wrap{gap:12px;padding-top:16px;padding-bottom:54px}
  .logo{width:38px;height:38px;border-radius:10px}
  .hero .wrap>div:nth-child(2){flex:1 1 0;min-width:0}
  .hero h1{font-size:18px;line-height:1.25}
  .hero p{font-size:12px;line-height:1.4}
  .spacer{display:none}
  .hero .seg button{padding:6px 12px;min-height:36px}
  .chip{flex:1 1 auto;min-width:0;justify-content:center;font-size:12px;padding:7px 10px}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #refresh{padding:8px 12px}
  /* date bar */
  .controls{margin-top:-34px}
  .bar{padding:14px;gap:14px}
  .bar>div{width:100%}
  #presets{display:flex;width:100%}
  #presets button{flex:1;padding:8px 2px;font-size:13px;white-space:nowrap}
  .dates{display:grid;grid-template-columns:1fr auto 1fr}
  .range-note{font-size:12px}
  /* tabs: one swipeable row */
  .tabs{flex-wrap:nowrap;overflow-x:auto;margin:16px -12px 4px;padding:2px 12px 8px;gap:8px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;white-space:nowrap;scroll-snap-align:center;min-height:42px}
  h2.title{font-size:22px;margin-top:14px}
  .sub{font-size:13px}
  /* search terms */
  .qbox>summary{padding:12px 14px;flex-wrap:wrap;gap:2px 10px}
  .qbody{padding:2px 14px 14px}
  .qrow{grid-template-columns:1fr;gap:4px}
  .qrow>b{padding-top:0}
  .qcode{flex-direction:column;gap:8px}
  .qcode code{width:100%}
  /* kpis and charts */
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:12px 14px}
  .kpi .v{font-size:22px}
  .charts{grid-template-columns:1fr;gap:12px}
  .card{padding:14px}
  .donut-wrap{justify-content:center}
  .acct .row{grid-template-columns:96px 1fr auto}
  /* toolbar */
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;align-items:end}
  .tools .grow,.tools .check,.tools #csv{grid-column:1/-1}
  .tools .f{min-width:0}
  .check{padding:6px 0;min-height:40px}
  .check input{width:20px;height:20px}
  .mob-sort{display:flex}
  .mob-sort .row2{display:flex;gap:8px}
  .mob-sort .row2 select{flex:1}
  .mob-sort .row2 .btn{padding:0 14px}
  #csv{justify-content:center;min-height:44px}
  /* table -> cards */
  .scroll{max-height:none;overflow:visible}
  table,tbody{display:block;min-width:0;width:100%}
  thead{display:none}
  tbody tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;padding:14px;background:#fff;border-bottom:8px solid var(--bg)}
  tbody tr:nth-child(even),tbody tr:hover{background:#fff}
  tbody td{display:block;padding:0;border:0;min-width:0}
  td.rank{order:1;width:auto;font-weight:800;color:var(--navy)}
  td.rank::before{content:"#"}
  td.date{order:2;flex:1;font-size:13px}
  td.date small{display:inline;margin-left:6px}
  td.s{order:3;margin-left:auto}
  td.acc{order:4;flex:0 0 100%}
  td.acc b{max-width:100%;font-size:15px}
  td.acc a{font-size:13px}
  td.o{order:5;flex:0 0 100%}
  td.e{order:6;flex:0 0 100%;background:var(--bg);border-radius:10px;padding:10px 12px}
  td.e::before{content:attr(data-label);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:2px}
  td.mt{order:7;flex:0 0 100%;max-width:none;min-width:0}
  td.m{order:8;flex:1 1 calc(33.333% - 8px);min-width:84px;text-align:left;background:var(--bg);border-radius:10px;padding:7px 10px;font-weight:700;font-size:14px}
  td.m::before{content:attr(data-label);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;white-space:nowrap}
  td.im{order:9;flex:0 0 auto}
  td.lk{order:9;flex:1}
  td.lk .linkbtn{width:100%;justify-content:center;min-height:44px;border-radius:10px;background:var(--accent-soft);font-size:14px}
  td.clk{display:none}
  .txt{max-width:none;min-width:0;font-size:14.5px;line-height:1.55}
  .more{padding:6px 0;font-size:13px}
  .thumb{width:56px;height:56px}
  .foot{padding:18px 0 32px}
  .toast{width:calc(100% - 24px);text-align:center;bottom:16px}
  .modal-bg{padding:0;place-items:end stretch}
  .modal{max-width:none;max-height:92vh;border-radius:18px 18px 0 0}
  .mhead,.mbody,.mfoot{padding-left:16px;padding-right:16px}
  .mmetrics{grid-template-columns:repeat(3,1fr)}
  .mfoot{flex-direction:column-reverse}
  .mfoot .btn{min-height:46px}
}
@media (max-width:360px){.kpi .k{font-size:10px}.kpis{gap:8px}td.m{flex-basis:calc(50% - 8px)}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#ffd166" stroke-width="2.6" stroke-linecap="round"/></svg></div>
    <div>
      <h1 data-i18n="title">XMTrading X Mention Monitor</h1>
      <p data-i18n="subtitle">Japanese posts mentioning XMTrading, including affiliates - ranked by engagement</p>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="lang" role="group" aria-label="Language / 言語">
      <button data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button data-lang="ja" aria-pressed="false" lang="ja">日本語</button>
    </div>
    <span class="chip" id="updated"><i></i><span>Loading...</span></span>
    <button class="btn ghost" id="refresh" data-i18n-title="refreshTip" title="Reload the published data">&#8635; <span data-i18n="refresh">Refresh data</span></button>
  </div>
</header>

<main class="wrap">
  <section class="controls panel" aria-label="Date range">
    <div class="bar">
      <div>
        <span class="lbl" data-i18n="dateRange" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:block;margin-bottom:4px">Date range (JST)</span>
        <div class="seg" id="presets" role="group" aria-label="Date presets">
          <button data-p="7" data-i18n="p7" aria-pressed="true">Last 7 days</button>

  }

  function sentimentCounts(rows) {
    const c = { Positive: 0, Negative: 0, Neutral: 0, Pending: 0 };
    rows.forEach((p) => { c[p.sentiment && SENT.includes(p.sentiment) ? p.sentiment : "Pending"]++; });
    return c;
  }

  function donut(c) {
    const tot = c.Positive + c.Negative + c.Neutral + c.Pending;
    const R = 54, C = 2 * Math.PI * R; let off = 0, segs = "";
    if (!tot) segs = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="#eef1f6" stroke-width="22"/>`;
    ["Positive", "Negative", "Neutral", "Pending"].forEach((k) => {
      if (!c[k]) return; const len = (c[k] / tot) * C;
      segs += `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${SENT_COLOR[k]}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${sentLabel(k)}: ${c[k]}</title></circle>`;
      off += len;
    });
    const rated = c.Positive + c.Negative + c.Neutral;
    const leg = ["Positive", "Negative", "Neutral", "Pending"].map((k) => {
      const base = k === "Pending" ? tot : rated; const pct = base ? ((c[k] / base) * 100).toFixed(1) : "0.0";
      return `<div><span class="dot" style="background:${SENT_COLOR[k]}"></span>${esc(sentLabel(k))}<b>${k === "Pending" ? c[k] : pct + "%"}</b></div>`;
    }).join("");
    return `<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${esc(t("sentRatio"))}">${segs}<text x="70" y="68" text-anchor="middle" font-size="22" font-weight="800" fill="#1b2437">${tot}</text><text x="70" y="86" text-anchor="middle" font-size="11" fill="#667085">${esc(t("postsWord"))}</text></svg><div class="legend">${leg}</div></div>`;
  }

  function dailyChart(rows) {
    if (!rows.length) return `<div class="empty" style="padding:30px">${esc(t("noData"))}</div>`;
    const days = {};
    rows.forEach((p) => { const d = jstDay(p.created_at); days[d] = (days[d] || 0) + 1; });
    const keys = Object.keys(days).sort(); const first = keys[0], last = keys[keys.length - 1];
    const span = Math.round((Date.parse(last) - Date.parse(first)) / 864e5) + 1;
    const series = []; for (let i = 0; i < span; i++) { const d = addDays(first, i); series.push([d, days[d] || 0]); }
    const W = 420, H = 170, pad = 22, bw = Math.max(2, (W - pad * 2) / series.length - 3), max = Math.max(...series.map((s) => s[1]));
    const bars = series.map(([d, n], i) => {
      const h = max ? ((H - 50) * n) / max : 0; const x = pad + i * ((W - pad * 2) / series.length) + 1.5;
      const lbl = series.length <= 8 || i % Math.ceil(series.length / 5) === 0 ? `<text x="${x + bw / 2}" y="${H - 6}" font-size="9.5" text-anchor="middle" fill="#667085">${d.slice(5)}</text>` : "";
      return `<g><rect x="${x}" y="${H - 22 - h}" width="${bw}" height="${Math.max(h, n ? 2 : 0)}" rx="3" fill="#3b6cff"><title>${d}: ${t("nPosts", n)}</title></rect>${n && series.length <= 16 ? `<text x="${x + bw / 2}" y="${H - 26 - h}" font-size="10" text-anchor="middle" fill="#344056" font-weight="700">${n}</text>` : ""}${lbl}</g>`;
    }).join("");
    return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("perDay"))}"><line x1="${pad}" x2="${W - pad}" y1="${H - 22}" y2="${H - 22}" stroke="#e4e8f0"/>${bars}</svg>`;
  }

  function topAccounts(rows) {
    const m = new Map();
    rows.forEach((p) => { const k = p.account_handle; const o = m.get(k) || { h: k, n: p.account_name, v: 0 }; o.v += p.impressions != null ? p.impressions : p.likes; m.set(k, o); });
    const top = [...m.values()].sort((a, b) => b.v - a.v).slice(0, 6); const max = top.length ? top[0].v : 1;
    if (!top.length) return `<div class="empty" style="padding:30px">${esc(t("noData"))}</div>`;
    return `<div class="acct">${top.map((o) => `<div class="row"><span class="name" title="${esc(o.n)}">@${esc(o.h)}</span><div class="track"><div class="fill" style="width:${max ? (o.v / max) * 100 : 0}%"></div></div><b>${fmt(o.v)}</b></div>`).join("")}</div>`;
  }

  const COLS = [
    ["rank", "cRank", false], ["created_at", "cDate", true], ["account", "cAccount", false], ["orig", "cOrig", false], ["en", "cEn", false],
    ["match", "cMatch", false], ["sentiment", "cSent", false], ["image", "cImage", false], ["url", "cPost", false],

  function closeModal(silent) {

  document.addEventListener("mousedown", (e) => { if (e.target.id === "modal") closeModal(); });
  document.addEventListener("keydown", (e) => {
    const m = $("#modal"); if (!m) return;
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key === "Tab") {
      const f = [...m.querySelectorAll("a[href],button")]; if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function searchPanel(topic) {
    const s = state.manifest.search; if (!s) return "";
    const q = (s.queries || {})[topic.id]; const kw = topic.keywords || [];
    const chips = (arr, cls) => `<div class="chips">${arr.map((x) => `<span class="chip2 ${cls}">${esc(x)}</span>`).join("")}</div>`;
    const flt = [t("qLang"), t("qNoRt"), t("qMinLikes", s.min_faves), t("qWindow", s.window_days, s.initial_backfill_days), t("qSort", s.sort), t("qMax", s.max_items)];
    return `<details class="panel qbox" id="qbox"${state.qOpen ? " open" : ""}>

        <div class="qrow"><b>${esc(t("qFilters"))}</b>${chips(flt, "flt")}</div>
        ${q ? `<div class="qrow"><b>${esc(t("qExact"))}</b><div><div class="qcode"><code>${esc(q)}</code><button data-copy="${esc(q)}">${esc(t("qCopy"))}</button></div><div class="qnote" style="margin-top:5px">${esc(t("qSince"))}</div></div></div>` : ""}
        <div class="qrow"><b>${esc(t("qAfter"))}</b><div class="qnote">${esc(t("qAfterTxt"))}</div></div>
      </div></details>`;
  }

  function renderContent() {
    const m = state.manifest; const topic = m.topics.find((t) => t.id === state.tab) || m.topics[0];
    const { rows, every, matched, total } = visiblePosts();
    const sum = (k) => every.reduce((s, p) => s + (p[k] || 0), 0);
    const accounts = new Set(every.map((p) => p.account_handle)).size;
    const kp = [[t("kPosts"), fmt(every.length), 1], [t("kAccounts"), fmt(accounts), 1], [t("kImpressions"), fmt(sum("impressions")), 0], [t("kLikes"), fmt(sum("likes")), 0], [t("kRetweets"), fmt(sum("retweets")), 0], [t("kReplies"), fmt(sum("replies")), 0], [t("kQuotes"), fmt(sum("quotes")), 0], [t("kBookmarks"), fmt(sum("bookmarks")), 0]];
    const lim = t("topN", state.limit);
    const head = COLS.map(([k, lk, sortable]) => {
      const label = esc(t(lk));
      const num = ["impressions", "likes", "replies", "quotes", "retweets", "bookmarks", "clicks"].includes(k);
      if (!sortable) return `<th class="${num ? "num" : ""}">${label}</th>`;
      const on = state.sort.key === k; const arrow = on ? (state.sort.dir < 0 ? "&#9660;" : "&#9650;") : "";
      return `<th class="${num ? "num" : ""}" aria-sort="${on ? (state.sort.dir < 0 ? "descending" : "ascending") : "none"}"><button data-sort="${k}" title="${esc(t("sortBy", t(lk)))}">${label} <span class="arrow">${arrow}</span></button></th>`;
    }).join("");
    const lbl = (id, key) => `<label class="lbl" for="${id}" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700">${esc(t(key))}</label>`;
    const sortCol = COLS.find((c) => c[0] === state.sort.key);
    $("#content").innerHTML = `
      <h2 class="title">${esc(topicName(topic))} <small>${esc(lim)}</small></h2>
      <p class="sub">${esc(t("shown", rows.length, matched))}${matched !== total ? esc(t("inTopic", total)) : ""}${esc(t("sortedBy", sortCol ? t(sortCol[1]) : state.sort.key))}</p>
      ${searchPanel(topic)}
      <section class="kpis" aria-label="Totals">${kp.map(([k, v, hl]) => `<div class="panel kpi${hl ? " hl" : ""}"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`).join("")}</section>
      <section class="charts">
        <div class="panel card"><h3>${esc(t("sentRatio"))}</h3>${donut(sentimentCounts(every))}</div>

          <div class="f">${lbl("sf", "sentiment")}
            <select id="sf">${["all", "Positive", "Negative", "Neutral", "Pending"].map((s) => `<option value="${s}"${state.sentiment === s ? " selected" : ""}>${esc(t(s))}</option>`).join("")}</select></div>
          <div class="f">${lbl("ml", "minLikes")}<input type="number" id="ml" min="0" step="1" value="${state.minLikes}"></div>
          <div class="f">${lbl("lm", "rows")}
            <select id="lm">${[[25, "25"], [50, "50"], [100, "100"], [0, t("all")]].map(([v, l]) => `<option value="${v}"${state.limit === v ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></div>
          <div class="f mob-sort">${lbl("sb", "sortLabel")}<div class="row2"><select id="sb">${COLS.filter((c) => c[2]).map((c) => `<option value="${c[0]}"${state.sort.key === c[0] ? " selected" : ""}>${esc(t(c[1]))}</option>`).join("")}</select><button class="btn" id="sd" title="${esc(t("dirTip"))}" aria-label="${esc(t("dirTip"))}">${state.sort.dir < 0 ? "&#9660;" : "&#9650;"}</button></div></div>

  function skeleton() {
    $("#content").innerHTML = `<div class="panel card" style="margin-top:24px"><div class="skeleton" style="width:40%;height:28px"></div><br><div class="skeleton"></div><br><div class="skeleton" style="width:80%"></div><br><div class="skeleton" style="width:60%"></div></div>`;

  async function refreshView() {
    try {
      resolveRange(); await ensureWeeks(); renderChrome(); renderContent(); writeHash();
    } catch (e) {
      $("#content").innerHTML = `<div class="err"><b>${esc(t("errLoad"))}</b><br>${esc(e.message)}<br>${t("errHint")}</div>`;

  // ---------- CSV ----------
  const CSV_HEAD = ["Date", "Account", "Language", "Content (Original)", "Content (JP -> EN LLM Translation)", "Impressions", "Likes", "Retweets", "Replies", "Quotes", "Bookmarks", "URL Clicks", "URL", "Image URL", "Topic Category", "Sentiment"];
  function exportCsv() {
    const names = Object.fromEntries(state.manifest.topics.map((t) => [t.id, t.name]));
    const cell = (v) => { let s = v == null ? "" : String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
    const { rows } = visiblePosts();
    const lines = [CSV_HEAD.map(cell).join(",")].concat(rows.map((p) => [
      jstDay(p.created_at) + " " + jstTime(p.created_at), `${p.account_name} (@${p.account_handle})`, p.lang, p.content_original, p.content_en, p.impressions, p.likes, p.retweets, p.replies, p.quotes, p.bookmarks, "", p.url, p.image_url,
      p.topics.map((t) => names[t] || t).join(", "), p.sentiment].map(cell).join(",")));
    const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `xm-${state.tab}-${state.from}_${state.to}.csv`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast(t("toastExported", rows.length));
  }

  // ---------- state in URL hash ----------
  function writeHash() {
    const h = new URLSearchParams({ tab: state.tab, range: state.preset, sort: state.sort.key, dir: state.sort.dir < 0 ? "desc" : "asc" });
    if (state.preset === "custom") { h.set("from", state.from); h.set("to", state.to); }
    history.replaceState(null, "", "#" + h.toString());
  }
  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("tab")) state.tab = h.get("tab");
    const r = h.get("range"); if (r && ["7", "14", "30", "all", "custom"].includes(r)) state.preset = r;
    if (state.preset === "custom" && /^\d{4}-\d\d-\d\d$/.test(h.get("from") || "") && /^\d{4}-\d\d-\d\d$/.test(h.get("to") || "")) { state.from = h.get("from"); state.to = h.get("to"); } else if (state.preset === "custom") state.preset = "7";
    if (COLS.some((c) => c[0] === h.get("sort") && c[2])) state.sort.key = h.get("sort");
    if (h.get("dir") === "asc") state.sort.dir = 1;
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a"); if (!t) return;
    if (t.dataset.p) { state.preset = t.dataset.p; refreshView(); }
    else if (t.dataset.t) { state.tab = t.dataset.t; renderChrome(); renderContent(); writeHash(); }
    else if (t.dataset.sort) { const k = t.dataset.sort; state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: -1 }; renderContent(); writeHash(); }
    else if (t.dataset.modal) openModal(t.dataset.modal, t);
    else if (t.dataset.close !== undefined) closeModal();
    else if (t.dataset.lang) setLang(t.dataset.lang);
    else if (t.dataset.copy) { const txt = t.dataset.copy; const done = () => toast(I18N[LANG].qCopied); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(done, () => { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (er) {} ta.remove(); }); }
    else if (t.id === "csv") exportCsv();
    else if (t.id === "sd") { state.sort.dir = -state.sort.dir; renderContent(); writeHash(); }
    else if (t.id === "showall") { state.preset = "all"; refreshView(); }
    else if (t.id === "refresh") doRefresh();
  });
  document.addEventListener("toggle", (e) => { if (e.target.id === "qbox") state.qOpen = e.target.open; }, true);
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.id === "from" || el.id === "to") { const f = $("#from").value, to = $("#to").value; if (f && to && f <= to) { state.preset = "custom"; state.from = f; state.to = to; refreshView(); } else if (f && to) toast(t("toastOrder")); }
    else if (el.id === "sf") { state.sentiment = el.value; renderContent(); }
    else if (el.id === "sb") { state.sort = { key: el.value, dir: -1 }; renderContent(); writeHash(); }
    else if (el.id === "lm") { state.limit = Number(el.value); renderContent(); }
    else if (el.id === "ml") { state.minLikes = Math.max(0, Number(el.value) || 0); renderContent(); }
    else if (el.id === "hp") { state.hidePromo = el.checked; renderContent(); }
  });
  let qTimer;
  document.addEventListener("input", (e) => {
    if (e.target.id !== "q") return; const v = e.target.value; clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = v; const pos = e.target.selectionStart; renderContent(); const el = $("#q"); el.focus(); el.setSelectionRange(pos, pos); }, 200);
  });

  async function doRefresh() {
    const b = $("#refresh"); b.disabled = true;
    try { await loadManifest(true); await refreshView(); toast(t("toastReloaded")); } catch (e) { toast(t("toastFail", e.message)); } finally { b.disabled = false; }
  }

  function applyStatic() {
    document.documentElement.lang = LANG;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
    document.querySelectorAll("[data-i18n-title]").forEach((n) => { n.title = t(n.dataset.i18nTitle); });
    $("#foot").textContent = t("footer");
    document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  }
  function setLang(l) {
    LANG = l === "ja" ? "ja" : "en";
    closeModal(true);
    try { localStorage.setItem("xm_lang", LANG); } catch (e) { /* storage unavailable */ }
    applyStatic();
    if (state.manifest) { renderChrome(); renderContent(); }
  }

  // ---------- boot ----------
  (async function boot() {
    readHash(); applyStatic(); skeleton();
    try { await loadManifest(true); } catch (e) {
      $("#updated").innerHTML = `<i style='background:#e5484d'></i><span>${esc(t("noDataChip"))}</span>`;
      $("#content").innerHTML = `<div class="err"><b>${esc(t("errLoad"))}</b><br>${esc(e.message)}<br>${t("errHint")}</div>`; return;
    }
    if (!state.manifest.topics.some((t) => t.id === state.tab)) state.tab = state.manifest.topics[0].id;
    await refreshView();
  })();
})();
</script>
</body>
</html>
